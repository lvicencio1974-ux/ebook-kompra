name: Publicar apps (Ondas de Calma y Audiometría)

on:
  push:
    branches: [main]
    paths: ["ondas-de-calma/**", "audiometria/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Armar el sitio
        run: |
          mkdir _site
          cp -r ondas-de-calma/. _site/
          cp -r audiometria _site/audiometria
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
